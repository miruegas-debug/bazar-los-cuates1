<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bazar Los Cuates - Jesús María</title>
<meta name="theme-color" content="#FFD600">
<link rel="manifest" href="./manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Black,Impact,sans-serif}
body{background:#0a0a0a;color:#fff}
.top-yellow{background:#FFD600;color:#000;text-align:center;padding:8px 10px;font-weight:900;font-size:14px;letter-spacing:0.5px}
.top-yellow.banner-grande{border-top:2px solid #000;font-size:40px;padding:32px 10px;line-height:1;letter-spacing:1px}
.header{background:#000;display:flex;align-items:center;justify-content:space-between;padding:12px 15px;border-bottom:2px solid #222;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:10px;font-weight:900}
.logo span.blc{background:#FFD600;color:#000;padding:6px 10px;font-size:20px}
.btn-wa{background:#FFD600;color:#000;padding:8px 16px;font-weight:900;text-decoration:none;display:inline-block}
.hero{padding:25px 20px;background:#111}
.hero h1{font-size:38px;line-height:0.95;font-weight:900;text-transform:uppercase}
.hero h1 mark{background:#FFD600;color:#000;padding:0 8px}
.hero-img{width:100%;height:280px;object-fit:cover;margin-top:20px;border:3px solid #222}
.marquee{background:#FFD600;color:#000;white-space:nowrap;overflow:hidden;padding:10px 0;font-weight:900;font-size:18px}
.buscador{padding:15px;background:#000}
.buscador input{width:100%;padding:14px;background:#111;border:2px solid #333;color:#fff;font-size:16px}
.grid{padding:15px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#1a1a1a;border:2px solid #222;padding:0;overflow:hidden}
.card img{width:100%;height:160px;object-fit:cover}
.card .info{padding:10px}
.card .info b{color:#FFD600}
.banners-grid{padding:15px;display:grid;grid-template-columns:1fr;gap:12px}
.banner-card{background:#000;border:3px solid #FFD600;padding:12px;display:flex;gap:10px;align-items:center}
.banner-card img{width:80px;height:80px;object-fit:cover;border:2px solid #333}
#descarga-app{background:#FFD600;color:#000;padding:35px 20px;text-align:center;border-top:6px solid #000;border-bottom:6px solid #000}
#descarga-app h2{font-size:28px;font-weight:900;line-height:1; text-transform:uppercase}
.footer{padding:25px 20px;background:#000;text-align:center;font-size:13px;color:#888}
</style>
</head>
<body>
<div class="top-yellow">ENTREGA AV CONSTITUCION 216 JESUS MARIA</div>
<div class="top-yellow banner-grande">ANUNCIATE AQUI $200 AL MES</div>
<div class="header"><div class="logo"><span class="blc">BLC</span> BAZAR LOS CUATES</div><a class="btn-wa" href="https://wa.me/524491883244" target="_blank">WHATSAPP</a></div>
<div class="hero"><h1>PIEZAS BUENAS,<br><mark>PRECIO CLARO</mark><br>Y TRATO DIRECTO</h1><img id="heroImg" class="hero-img" src="https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?w=800"></div>
<div class="marquee">MUEBLES ◆ CUCHILLOS ◆ BOCINAS ◆ ELECTRONICA ◆ HERRAMIENTA ◆ TODO PARA EL HOGAR ◆</div>
<div class="buscador"><input id="buscador" type="text" placeholder="Buscar pieza..."></div>
<div class="grid" id="catalogo"></div>
<div id="seccionBanners"></div>
<section id="descarga-app"><h2>DESCARGA LA APP</h2></section>
<div class="footer">Bazar Los Cuates - Av. Constitución 216</div>
<script>
function getProductos(){try{const g=localStorage.getItem('bazar_productos');if(g)return JSON.parse(g);}catch{}return[];}
function getBanners(){try{const g=localStorage.getItem('bazar_banners');if(g)return JSON.parse(g);}catch{}return[];}
function renderCatalogo(filtro=""){const catalogo=document.getElementById('catalogo');const productos=getProductos();const f=filtro.toLowerCase();const filtrados=productos.filter(p=>(p.nombre+" "+p.precio).toLowerCase().includes(f));catalogo.innerHTML="";if(filtrados.length===0){catalogo.innerHTML="<p style='grid-column:1/3;color:#888;padding:20px;text-align:center'>No hay piezas aún</p>";return;}filtrados.forEach(p=>{const imgSrc=(p.fotos&&p.fotos[0])?p.fotos[0]:p.img;const div=document.createElement('div');div.className="card";div.innerHTML=`<img src="${imgSrc}"><div class="info"><b>${p.nombre}</b><br>${p.precio}</div>`;catalogo.appendChild(div);});}
function renderBanners(){const cont=document.getElementById('seccionBanners');const banners=getBanners();if(banners.length===0){cont.innerHTML="";return;}let html='<div class="banners-grid">';banners.forEach(b=>{const thumb=(b.fotos&&b.fotos[0])?b.fotos[0]:b.img;html+=`<div class="banner-card"><img src="${thumb}"><div><b style="color:#FFD600">${b.negocio}</b><br>$${b.precio}/mes</div></div>`;});html+='</div>';cont.innerHTML=html;}
const portada=localStorage.getItem('bazar_portada');if(portada){document.getElementById('heroImg').src=portada;}
const precioBanner=localStorage.getItem('bazar_banner_precio');if(precioBanner){document.querySelector('.banner-grande').innerText=`ANUNCIATE AQUI $${precioBanner} AL MES`;}
renderCatalogo();renderBanners();
document.getElementById('buscador').addEventListener('input',e=>renderCatalogo(e.target.value));
</script>
</body>
</html>
