<!DOCTYPE html>
<html lang="es-MX">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bazar Los Cuates</title>
<link rel="manifest" href="./manifest.json"><meta name="theme-color" content="#FFD600">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:Arial}
.top-bar{background:#FFD600;color:#000;text-align:center;padding:6px;font-size:12px;font-weight:900}
.catalogo{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.card{background:#1a1a1a;border-radius:10px;overflow:hidden;border:1px solid #222}
.card img{width:100%;height:160px;object-fit:cover}
.card .info{padding:10px}
.card b{font-size:13px;display:block;margin-bottom:4px}
.card .btn{display:block;background:#FFD600;color:#000;text-align:center;padding:8px;border-radius:6px;text-decoration:none;font-weight:900;margin-top:6px;font-size:12px}
.buscador{padding:12px;background:#111}
.buscador input{width:100%;padding:12px;border-radius:8px;border:2px solid #333;background:#1a1a1a;color:#fff}
.contador{padding:8px 12px;background:#0a0a0a;color:#888;font-size:11px;display:flex;gap:15px;justify-content:center;border-bottom:1px solid #1a1a1a}
.contador span{color:#FFD600;font-weight:900}
</style></head>
<body>
<div style="background:#FFD600;color:#000;text-align:center;padding:6px;font-size:12px;font-weight:900">BAZAR LOS CUATES - JESÚS MARÍA, AGS</div>
<div class="buscador"><input id="buscador" placeholder="Buscar pieza..."></div>
<div class="contador"><div>Hoy: <span id="visitasHoy">0</span></div><div>Total: <span id="visitasTotal">0</span></div></div>
<div id="catalogo" class="catalogo"><p style="grid-column:1/3;text-align:center;padding:30px;color:#888">Cargando desde la nube...</p></div>
<a href="./admin.html" style="display:block;text-align:center;color:#555;font-size:11px;text-decoration:none;margin:20px">Admin</a>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyClr4Ij1fzQ7-5zgPtzkQkhB1VsfD5zBm4",
    authDomain: "bazar-los-cuates.firebaseapp.com",
    projectId: "bazar-los-cuates",
    storageBucket: "bazar-los-cuates.firebasestorage.app",
    messagingSenderId: "908351301550",
    appId: "1:908351301550:web:3ae25892920ce8dda24a3f",
    measurementId: "G-XT51JZ4H5L"
  };

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let productosNube=[]; let filtro="";
async function cargarProductos(){
  const snap=await getDocs(collection(db,"productos"));
  productosNube=[]; snap.forEach(d=>productosNube.push({id:d.id,...d.data()}));
  productosNube.sort((a,b)=>(b.fecha||0)-(a.fecha||0));
  renderCatalogo();
}
function renderCatalogo(){
  const cont=document.getElementById('catalogo');
  const lista=productosNube.filter(x=>(x.nombre+" "+x.precio).toLowerCase().includes(filtro.toLowerCase()));
  cont.innerHTML=""; 
  if(lista.length==0){cont.innerHTML="<p style='grid-column:1/3;text-align:center;padding:30px;color:#666'>No hay piezas. Agrégalas en Admin</p>";return;}
  lista.forEach(prod=>{
    const wa=`https://wa.me/524491883244?text=${encodeURIComponent('Hola me interesa '+prod.nombre+' $'+prod.precio)}`;
    const d=document.createElement('div'); d.className='card';
    d.innerHTML=`<img src="${prod.foto}"><div class="info"><b>${prod.nombre}</b><span style="color:#FFD600;font-weight:900">$${prod.precio}</span><a class="btn" href="${wa}" target="_blank">WHATSAPP</a></div>`;
    cont.appendChild(d);
  });
}
async function contador(){
  const hoyStr=new Date().toISOString().split('T')[0];
  const ref=doc(db,"stats","visitas");
  const snap=await getDoc(ref);
  let data=snap.exists()?snap.data():{total:0,hoy:0,fecha:""};
  if(data.fecha!==hoyStr){data.hoy=0;data.fecha=hoyStr;}
  data.total=(data.total||0)+1; data.hoy=(data.hoy||0)+1;
  await setDoc(ref,data);
  document.getElementById('visitasTotal').innerText=data.total;
  document.getElementById('visitasHoy').innerText=data.hoy;
}
document.getElementById('buscador').addEventListener('input',e=>{filtro=e.target.value;renderCatalogo();});
cargarProductos(); contador();
</script>
</body></html>
