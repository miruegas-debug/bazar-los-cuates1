<section id="descarga-app" style="background:#FFD600;color:#000;padding:35px 20px;text-align:center;margin-top:30px;border-top:6px solid #000">
<h2 style="font-size:26px;font-weight:900">DESCARGA LA APP<br>DE BAZAR LOS CUATES</h2>
<p style="margin:12px 0;font-weight:600">Te aviso primero cuando suba piezas buenas. Se instala en 2 segundos.</p>
<button id="btn-instalar-app" style="background:#000;color:#FFD600;border:0;padding:14px 20px;font-weight:900;width:90%;max-width:260px;margin:5px">📲 INSTALAR APP</button>
<button id="btn-activar-push" style="background:#fff;color:#000;border:4px solid #000;padding:14px 20px;font-weight:900;width:90%;max-width:260px;margin:5px">🔔 ACTIVAR NOTIFICACIONES</button>
<p id="estatus-push" style="margin-top:12px;font-weight:900"></p>
</section>

<script>
let deferredPrompt;const btnInstalar=document.getElementById('btn-instalar-app');
window.addEventListener('beforeinstallprompt',(e)=>{e.preventDefault();deferredPrompt=e;btnInstalar.textContent='📲 INSTALAR APP - LISTA'});
btnInstalar.addEventListener('click',async()=>{if(!deferredPrompt){alert('En Chrome dale a los 3 puntitos > Instalar app');return;}deferredPrompt.prompt();const r=await deferredPrompt.userChoice;if(r.outcome==='accepted'){btnInstalar.textContent='✅ APP INSTALADA';}deferredPrompt=null;});
document.getElementById('btn-activar-push').addEventListener('click',async()=>{const s=document.getElementById('estatus-push');const p=await Notification.requestPermission();if(p!=='granted'){s.textContent='❌ Dale a Permitir';return;}s.textContent='🔔 ¡Activadas! Te aviso cuando suba piezas.';new Notification('Bazar Los Cuates',{body:'¡Listo! Ya te aviso de cada pieza nueva.'});});
</script>
