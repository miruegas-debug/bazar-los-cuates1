<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLC 2026 - Bazar Los Cuates</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white m-0">

<div class="w-full h-[90px] bg-zinc-900 flex items-center justify-between border-b border-zinc-800 px-4">
<div class="text-3xl font-black leading-none">PIEZAS BUENAS,<br><span class="text-yellow-400">PRECIOS BUENOS.</span></div>
<div class="bg-yellow-400 text-black font-black py-2 px-4 text-sm">BLC 2026</div>
</div>

<div class="p-3 bg-black border-b border-zinc-800">
<input id="buscador" placeholder="Busca taladro, bocina, mueble..." class="w-full p-3 rounded bg-zinc-900 border border-zinc-700 text-white">
</div>

<!-- BANNER ARREGLADO - NO SOTA, REEL DE TUS FOTOS -->
<div id="banner" class="w-full h-[280px] md:h-[380px] max-h-[45vh] overflow-hidden bg-black flex items-center justify-center relative"></div>

<div id="grid" class="p-3 grid grid-cols-2 md:grid-cols-4 gap-3 bg-black"></div>

<div id="popupEntrada" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50">
<div class="bg-white rounded p-2"><img id="portada" class="max-w-full max-h-[80vh] object-contain"></div>
</div>

<script>
let productos = JSON.parse(localStorage.getItem('bazar_productos')||'[{"id":1,"nombre":"Taladro Bosch","precio":1200,"img":"https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?w=400"}]');
let banners = JSON.parse(localStorage.getItem('bazar_banners')||'[]');
let portada = localStorage.getItem('bazar_portada')||'';
let b = document.getElementById('banner');

if(banners.length==0){
  b.innerHTML = `<div class='text-zinc-600 text-center'><p class='font-black text-xl'>BAZAR LOS CUATES</p><p class='text-sm'>Sube tu banner en el admin</p></div>`;
  b.style.height='120px';
}else{
  let idx=0;
  b.innerHTML = `<img id='imgBanner' src='${banners[0]}' style='width:100%;height:100%;object-fit:contain;background:#000;display:block'>`;
  if(banners.length>1){
    setInterval(()=>{
      idx=(idx+1)%banners.length;
      let img=document.getElementById('imgBanner');
      if(img) img.src=banners[idx];
    },3000);
  }
}

let g=document.getElementById('grid');
let q=document.getElementById('buscador');
function renderGrid(){
  let val=(q.value||'').toLowerCase();
  let filtrados=productos.filter(p=>p.nombre.toLowerCase().includes(val));
  g.innerHTML=filtrados.map(p=>`<div class="bg-zinc-900 rounded overflow-hidden border border-zinc-800"><img src="${p.img||p.imagen}" class="w-full h-[150px] object-cover"><div class="p-2"><div class="font-bold text-sm">${p.nombre}</div><div class="text-yellow-400 font-black">$${p.precio}</div><a href="https://wa.me/524491883244?text=Me interesa ${encodeURIComponent(p.nombre)}" target="_blank" class="block mt-2 bg-yellow-400 text-black text-center font-black py-2 rounded">WhatsApp</a></div></div>`).join('');
}
q.addEventListener('input',renderGrid);
renderGrid();

if(portada){
  document.getElementById('portada').src=portada;
  let pop=document.getElementById('popupEntrada');
  pop.classList.remove('hidden');
  pop.classList.add('flex');
  pop.onclick=()=>{pop.classList.add('hidden')};
}
</script>
</body>
</html>
