<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PANEL ADMIN - Bazar Los Cuates</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Black,Impact,sans-serif}
body{background:#0a0a0a;color:#fff;padding:0}
.top-bar{background:#000;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:2px solid #222;position:sticky;top:0;z-index:10}
.top-bar b{color:#FFD600;font-size:20px}
.btn-salir{background:#ff0000;color:#fff;border:0;padding:8px 14px;font-weight:900;cursor:pointer}
.seccion{border:1px solid #333;margin:12px 4px;background:#111}
.seccion h2{color:#FFD600;padding:12px 12px 6px;font-size:18px}
.seccion .cont{padding:0 12px 12px}
input, select, textarea{width:100%;background:#000;color:#fff;border:1px solid #555;padding:12px;margin:6px 0;font-size:15px}
textarea{height:70px;resize:vertical}
.btn-amarillo{background:#FFD600;color:#000;border:0;padding:10px 16px;font-weight:900;cursor:pointer;margin:6px 0}
.btn-amarillo.grande{width:100%;padding:14px;font-size:16px;margin-top:10px}
.fotos-label{font-size:13px;color:#ccc;margin-top:8px;display:block}
.producto-row{display:flex;align-items:center;justify-content:space-between;background:#000;border-top:1px solid #222;border-bottom:1px solid #222;padding:8px;margin:1px 0}
.producto-row img{width:70px;height:70px;object-fit:cover;background:#222}
.producto-info{flex:1;padding:0 10px}
.producto-info b{color:#FFD600;display:block;font-size:15px}
.producto-info span{color:#fff;font-size:14px}
.btn-borrar{background:#ff0000;color:#fff;border:0;padding:14px 18px;font-weight:900;cursor:pointer;font-size:13px}
.mini-fotos{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.mini-foto{position:relative;width:60px;height:60px}
.mini-foto img{width:100%;height:100%;object-fit:cover;border:1px solid #333}
.mini-foto .x{position:absolute;top:-6px;right:-6px;background:#ff0000;color:#fff;border:0;width:20px;height:20px;border-radius:50%;font-weight:900;cursor:pointer}
</style>
</head>
<body class="p-4">

<div class="top-bar">
<b>PANEL ADMIN</b>
<button class="btn-salir" onclick="location.href='./index.html'">SALIR</button>
</div>

<div class="seccion">
<h2>1. PORTADA</h2>
<div class="cont">
<input type="file" id="portadaFile" accept="image/*">
<img id="preview-portada" style="width:100%;max-height:180px;object-fit:cover;display:none;margin:6px 0;border:1px solid #333">
<button class="btn-amarillo" id="btnPortada">GUARDAR PORTADA</button>
<p id="msgPortada" style="font-size:12px;color:#22c55e"></p>
</div>
</div>

<div class="seccion">
<h2>2. PRODUCTO CON X PARA BORRAR FOTO</h2>
<div class="cont">
<input id="nombre" placeholder="Nombre">
<input id="precio" placeholder="Precio">
<select id="categoria">
<option>HERRAMIENTA</option>
<option>MUEBLES</option>
<option>CUCHILLOS</option>
<option>BOCINAS</option>
<option>ELECTRONICA</option>
<option>HOGAR</option>
<option>OTRO</option>
</select>
<textarea id="desc" placeholder="Desc"></textarea>
<span class="fotos-label">FOTOS N (con X):</span>
<input type="file" id="fotosFiles" accept="image/*" multiple>
<div id="miniFotos" class="mini-fotos"></div>
<button class="btn-amarillo grande" id="btnAgregar">AGREGAR PRODUCTO</button>
<p id="msgProd" style="font-size:12px;color:#22c55e;text-align:center;margin-top:6px"></p>
</div>
</div>

<div id="listaProductos"></div>

<div class="seccion">
<h2>3. BANNERS</h2>
<div class="cont">
<span style="font-size:13px">Precio editable:</span>
<div style="display:flex;gap:8px;align-items:center">
<input id="bannerPrecio" value="200" style="border:1px solid #FFD600">
<button class="btn-amarillo" id="btnGuardarPrecio">GUARDAR</button>
</div>
<input id="bannerNegocio" placeholder="Negocio">
<input id="bannerTel" placeholder="4491234567">
<input type="file" id="bannerFile" accept="image/*">
<button class="btn-amarillo grande" id="btnBanner">AGREGAR BANNER</button>
<div id="listaBanners"></div>
</div>
</div>

<script>
function getProductos(){ try{let g=localStorage.getItem('bazar_productos'); if(g) return JSON.parse(g);}catch{} return []; }
function saveProductos(a){ localStorage.setItem('bazar_productos', JSON.stringify(a)); }
let fotosTemp = [];
let portadaTemp = "";
document.getElementById('portadaFile').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=ev=>{ portadaTemp=ev.target.result; const img=document.getElementById('preview-portada'); img.src=portadaTemp; img.style.display='block'; }; r.readAsDataURL(f);
});
document.getElementById('btnPortada').addEventListener('click', ()=>{
  if(!portadaTemp){ alert('Selecciona archivo primero'); return; }
  localStorage.setItem('bazar_portada', portadaTemp);
  document.getElementById('msgPortada').innerText='✅ Portada guardada';
});
document.getElementById('fotosFiles').addEventListener('change', e=>{
  Array.from(e.target.files).forEach(file=>{
    const r=new FileReader(); r.onload=ev=>{ fotosTemp.push(ev.target.result); renderMini(); }; r.readAsDataURL(file);
  });
});
function renderMini(){
  const cont=document.getElementById('miniFotos'); cont.innerHTML="";
  fotosTemp.forEach((src,i)=>{
    const d=document.createElement('div'); d.className='mini-foto';
    d.innerHTML=`<img src="${src}"><button class="x" onclick="fotosTemp.splice(${i},1);renderMini()">X</button>`;
    cont.appendChild(d);
  });
}
document.getElementById('btnAgregar').addEventListener('click', ()=>{
  const nombre=document.getElementById('nombre').value.trim();
  const precio=document.getElementById('precio').value.trim();
  if(!nombre||!precio){ alert('Pon Nombre y Precio'); return; }
  if(fotosTemp.length===0){ alert('Pon al menos 1 foto'); return; }
  let productos=getProductos();
  productos.push({id:Date.now(), nombre, precio, categoria:document.getElementById('categoria').value, desc:document.getElementById('desc').value, fotos:fotosTemp, img:fotosTemp[0]});
  saveProductos(productos);
  document.getElementById('nombre').value=""; document.getElementById('precio').value=""; document.getElementById('desc').value=""; fotosTemp=[]; renderMini(); document.getElementById('fotosFiles').value="";
  document.getElementById('msgProd').innerText='✅ Producto agregado';
  renderProductos();
});
function renderProductos(){
  const lista=document.getElementById('listaProductos'); lista.innerHTML="";
  getProductos().slice().reverse().forEach(p=>{
    const row=document.createElement('div'); row.className='producto-row';
    row.innerHTML=`<img src="${p.fotos? p.fotos[0] : p.img}"><div class="producto-info"><b>${p.nombre}</b><span>$${p.precio.replace('$','')}</span></div><button class="btn-borrar" onclick="borrarProd(${p.id})">BORRAR</button>`;
    lista.appendChild(row);
  });
}
function borrarProd(id){ if(!confirm('¿Borrar?')) return; saveProductos(getProductos().filter(p=>p.id!==id)); renderProductos(); }
document.getElementById('btnGuardarPrecio').addEventListener('click', ()=>{
  localStorage.setItem('bazar_banner_precio', document.getElementById('bannerPrecio').value);
  alert('Precio guardado: $'+document.getElementById('bannerPrecio').value);
});
function getBanners(){ try{let g=localStorage.getItem('bazar_banners'); if(g) return JSON.parse(g);}catch{} return []; }
function saveBanners(a){ localStorage.setItem('bazar_banners', JSON.stringify(a)); }
document.getElementById('btnBanner').addEventListener('click', ()=>{
  const neg=document.getElementById('bannerNegocio').value.trim();
  if(!neg){ alert('Pon negocio'); return; }
  const b={id:Date.now(), negocio:neg, tel:document.getElementById('bannerTel').value, precio:localStorage.getItem('bazar_banner_precio')||'200'};
  const file=document.getElementById('bannerFile').files[0];
  if(file){ const r=new FileReader(); r.onload=ev=>{ b.img=ev.target.result; let arr=getBanners(); arr.push(b); saveBanners(arr); renderBanners(); }; r.readAsDataURL(file); }else{ let arr=getBanners(); arr.push(b); saveBanners(arr); renderBanners(); }
});
function renderBanners(){
  const cont=document.getElementById('listaBanners'); cont.innerHTML="";
  getBanners().forEach(b=>{
    const d=document.createElement('div'); d.style="display:flex;justify-content:space-between;background:#000;border:1px solid #333;padding:6px;margin:4px 0;font-size:13px";
    d.innerHTML=`<span>${b.negocio} - $${b.precio}</span><button style="background:red;color:#fff;border:0;padding:4px 8px" onclick="saveBanners(getBanners().filter(x=>x.id!==${b.id}));renderBanners()">X</button>`;
    cont.appendChild(d);
  });
}
document.getElementById('bannerPrecio').value = localStorage.getItem('bazar_banner_precio')||'200';
renderProductos(); renderBanners();
</script>
</body>
</html>
