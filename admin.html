<!DOCTYPE html>
<html lang="es-MX">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ADMIN BAZAR</title>
<style>body{background:#111;color:#fff;padding:15px;font-family:Arial}h1{background:#FFD600;color:#000;padding:12px;text-align:center} .box{background:#1a1a1a;border:2px solid #333;padding:12px;margin:12px 0;border-radius:8px} input{width:100%;padding:12px;margin:6px 0;background:#222;border:2px solid #333;color:#fff} button{padding:12px;border:0;border-radius:6px;font-weight:900;margin:4px;cursor:pointer} .y{background:#FFD600;color:#000} .r{background:#ff4444;color:#fff} .g{display:flex;gap:8px;flex-wrap:wrap} .g img{width:80px;height:80px;object-fit:cover;border:2px solid #333}</style>
</head>
<body>
<h1>ADMIN BAZAR LOS CUATES</h1>
<div class="box">
<h3 style="color:#FFD600">1. FOTO DE PORTADA - SE QUEDA HASTA QUE TU LA CAMBIES</h3>
<p style="font-size:12px;color:#888">Sube 1 a 5 fotos, se quedarán fijas hasta que tú les des a BORRAR o CAMBIAR.</p>
<input type="file" id="filePortada" accept="image/*" multiple>
<div id="prevP" class="g"></div>
<button class="y" id="btnGP">💾 GUARDAR PORTADA FIJA</button>
<button class="r" id="btnBP">🗑️ BORRAR PORTADA</button>
<p id="msgP" style="color:#22c55e"></p>
<div style="margin-top:10px;color:#888;font-size:11px">Guardada en: <span id="statusP"></span></div>
</div>
<div class="box">
<h3 style="color:#FFD600">2. PRODUCTOS</h3>
<input id="nP" placeholder="Nombre">
<input id="pP" placeholder="Precio">
<input type="file" id="fP" accept="image/*" multiple>
<div id="prevPr" class="g"></div>
<button class="y" id="btnGPr">GUARDAR PRODUCTO</button>
<p id="msgPr" style="color:#22c55e"></p>
</div>
<div class="box">
<h3>Guardados (<span id="cPr">0</span>)</h3>
<div id="lista"></div>
<a href="./index.html" style="color:#FFD600">← Ver página</a> | <a href="./admin_anuncios.html" style="color:#FFD600">Anuncios</a>
</div>
<script>
let portadas=[]; 
document.getElementById('filePortada').addEventListener('change',e=>{
  portadas=[];let prev=document.getElementById('prevP');prev.innerHTML="";
  for(let f of e.target.files){let r=new FileReader();r.onload=ev=>{portadas.push(ev.target.result);let im=document.createElement('img');im.src=ev.target.result;prev.appendChild(im);document.getElementById('statusP').innerText=portadas.length+" fotos listas para guardar";};r.readAsDataURL(f);}
});
document.getElementById('btnGP').addEventListener('click',()=>{
  if(portadas.length==0){alert('Primero selecciona fotos');return;}
  localStorage.setItem('bazar_portadas',JSON.stringify(portadas));
  document.getElementById('msgP').innerText='✅ PORTADA GUARDADA FIJA - Ya no se cambia sola. Ve a tu index y refresca.';
  document.getElementById('statusP').innerText='Guardado: '+new Date().toLocaleString();
});
document.getElementById('btnBP').addEventListener('click',()=>{
  if(!confirm('¿Borrar tu portada fija? Volverá la default'))return;
  localStorage.removeItem('bazar_portadas');portadas=[];document.getElementById('prevP').innerHTML="";document.getElementById('msgP').innerText='Borrada';
});
let prods=[];document.getElementById('fP').addEventListener('change',e=>{
  prods=[];let prev=document.getElementById('prevPr');prev.innerHTML="";
  for(let f of e.target.files){let r=new FileReader();r.onload=ev=>{prods.push(ev.target.result);let im=document.createElement('img');im.src=ev.target.result;prev.appendChild(im);};r.readAsDataURL(f);}
});
function getPr(){try{return JSON.parse(localStorage.getItem('bazar_productos'))||[]}catch{return[]}}
function savePr(a){localStorage.setItem('bazar_productos',JSON.stringify(a))}
function render(){let l=document.getElementById('lista');let ps=getPr();document.getElementById('cPr').innerText=ps.length;l.innerHTML="";ps.forEach(p=>{let d=document.createElement('div');d.style.cssText='display:flex;gap:10px;background:#222;padding:8px;margin:6px 0';d.innerHTML=`<img src="${p.fotos?p.fotos[0]:p.img}" style="width:60px;height:60px;object-fit:cover"><div style="flex:1"><b>${p.nombre}</b><br>$${p.precio}<br><button class="r" onclick="borrar(${p.id})">Borrar</button></div>`;l.appendChild(d);});}
function borrar(id){if(!confirm('¿Borrar?'))return;savePr(getPr().filter(x=>x.id!==id));render();}
document.getElementById('btnGPr').addEventListener('click',()=>{
  let n=document.getElementById('nP').value.trim();let p=document.getElementById('pP').value.trim();
  if(!n||!p||prods.length==0){alert('Pon nombre, precio y foto');return;}
  let pr=getPr();pr.unshift({id:Date.now(),nombre:n,precio:p,fotos:prods,img:prods[0]});savePr(pr);
  document.getElementById('nP').value='';document.getElementById('pP').value='';document.getElementById('fP').value='';document.getElementById('prevPr').innerHTML="";prods=[];render();
});
let guardadas=JSON.parse(localStorage.getItem('bazar_portadas')||'[]');
document.getElementById('statusP').innerText=guardadas.length>0?'Ya tienes '+guardadas.length+' portadas fijas guardadas desde antes':'No tienes portada fija, sale la default';
render();
</script>
</body>
</html>
