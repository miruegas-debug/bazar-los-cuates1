<!DOCTYPE html>
<html lang="es-MX">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Bazar Los Cuates</title>
<style>
body{background:#000;color:#fff;font-family:Arial;padding:12px}
.card{background:#1a1a1a;border-radius:10px;padding:15px;margin-bottom:15px;border:1px solid #222}
input,button{width:100%;padding:12px;border-radius:8px;border:1px solid #333;background:#222;color:#fff;margin-top:8px}
button{background:#FFD600;color:#000;font-weight:900;border:0;cursor:pointer}
.lista{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.item{background:#111;padding:8px;border-radius:8px;text-align:center}
.item img{width:100%;height:100px;object-fit:cover;border-radius:6px}
#preview{width:100%;max-height:200px;object-fit:contain;margin-top:10px;display:none;border-radius:8px}
</style>
</head>
<body>
<h2 style="color:#FFD600">ADMIN BAZAR - NUBE</h2>
<p style="font-size:11px;color:#22c55e">✅ Conectado a bazar-los-cuates</p>
<div class="card">
<b>Agregar Pieza</b>
<input id="nombre" placeholder="Ej: Cuna dorada">
<input id="precio" type="number" placeholder="Ej: 750">
<input id="foto" type="file" accept="image/*">
<img id="preview">
<button id="btnGuardar">GUARDAR EN LA NUBE DE GOOGLE</button>
<p id="status" style="font-size:12px;color:#22c55e;margin-top:8px">Listo</p>
</div>
<div class="card">
<b>Piezas en la nube</b>
<div id="lista" class="lista">Cargando...</div>
</div>
<div class="card"><a href="./index.html" style="color:#FFD600">← Volver a tienda</a></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyClr4Ij1fzQ7-5zgPtzkQkhB1VsfD5zBm4",
    authDomain: "bazar-los-cuates.firebaseapp.com",
    projectId: "bazar-los-cuates",
    storageBucket: "bazar-los-cuates.firebasestorage.app",
    messagingSenderId: "908351301550",
    appId: "1:908351301550:web:3ae25892920ce8dda24a3f",
    measurementId: "G-XT51JZ4H5L"
  };

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
let fotoBase64="";
document.getElementById('foto').addEventListener('change', (e)=>{
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement('canvas');
      const maxW=600; let w=img.width, h=img.height;
      if(w>maxW){h=(maxW/w)*h; w=maxW;}
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      fotoBase64=canvas.toDataURL('image/jpeg',0.6);
      document.getElementById('preview').src=fotoBase64;
      document.getElementById('preview').style.display='block';
      document.getElementById('status').innerText=`Foto lista: ${Math.round(fotoBase64.length/1024)} KB`;
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
});
async function cargar(){
  const lista=document.getElementById('lista');
  const snap=await getDocs(collection(db,"productos"));
  lista.innerHTML="";
  if(snap.empty){lista.innerHTML="<p style='color:#666'>No hay piezas</p>"; return;}
  snap.forEach(d=>{
    const p=d.data();
    const div=document.createElement('div'); div.className='item';
    div.innerHTML=`<img src="${p.foto}"><br><b>${p.nombre}</b><br>$${p.precio}<br><button onclick="borrar('${d.id}')" style="background:#ef4444;color:#fff;margin-top:6px">Borrar</button>`;
    lista.appendChild(div);
  });
}
window.borrar=async(id)=>{
  if(!confirm("¿Borrar?")) return;
  await deleteDoc(doc(db,"productos",id));
  cargar();
}
document.getElementById('btnGuardar').onclick=async()=>{
  const nombre=document.getElementById('nombre').value.trim();
  const precio=document.getElementById('precio').value.trim();
  const status=document.getElementById('status');
  if(!nombre||!precio||!fotoBase64){alert("Pon nombre, precio y foto");return;}
  status.innerText="Guardando en Google...";
  await addDoc(collection(db,"productos"),{nombre,precio,foto:fotoBase64,fecha:Date.now()});
  status.innerText="✅ ¡Guardado! Ya se ve en Brave y Chrome igual";
  document.getElementById('nombre').value=""; document.getElementById('precio').value=""; document.getElementById('foto').value=""; document.getElementById('preview').style.display='none'; fotoBase64="";
  cargar();
}
cargar();
</script>
</body></html>
