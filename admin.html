<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PANEL ADMIN - Bazar Los Cuates - COMPLETO FINAL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Black,Impact,sans-serif}
body{background:#0a0a0a;color:#fff;padding:0}
.top-bar{background:#000;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:2px solid #222;position:sticky;top:0;z-index:10}
.top-bar b{color:#FFD600;font-size:18px}
.btn-salir{background:#ff0000;color:#fff;border:0;padding:8px 14px;font-weight:900;cursor:pointer}
.seccion{border:1px solid #333;margin:12px 4px;background:#111}
.seccion h2{color:#FFD600;padding:12px;font-size:16px}
.cont{padding:0 12px 12px}
input, select, textarea{width:100%;background:#000;color:#fff;border:1px solid #555;padding:12px;margin:6px 0;font-size:15px}
.btn-amarillo{background:#FFD600;color:#000;border:0;padding:12px;font-weight:900;cursor:pointer;width:100%;margin-top:8px;font-size:15px}
.btn-amarillo.peq{width:auto;padding:8px 16px}
.mini-fotos{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.mini-foto{position:relative;width:65px;height:65px}
.mini-foto img{width:100%;height:100%;object-fit:cover;border:1px solid #333}
.mini-foto .x{position:absolute;top:-6px;right:-6px;background:#ff0000;color:#fff;border:0;width:20px;height:20px;border-radius:50%;font-weight:900;cursor:pointer}
.producto-row{display:flex;align-items:center;justify-content:space-between;background:#000;border:1px solid #222;padding:8px;margin:6px 0}
.producto-row img{width:70px;height:70px;object-fit:cover}
.producto-info{flex:1;padding:0 10px}
.producto-info b{color:#FFD600;display:block;font-size:14px}
.btn-borrar{background:#ff0000;color:#fff;border:0;padding:10px 14px;font-weight:900;cursor:pointer}
#preview-portada{width:100%;max-height:200px;object-fit:cover;display:none;margin:6px 0;border:1px solid #333}
.ok{color:#22c55e;text-align:center;padding:6px;font-size:12px;font-weight:900}
</style>
</head>
<body>
<div class="top-bar"><b>PANEL ADMIN</b><button class="btn-salir" onclick="location.href='./index.html'">SALIR</button></div>
<div style="background:#FFD600;color:#000;text-align:center;padding:5px;font-weight:900;font-size:11px">COMPLETO FINAL - PORTADA + PRODUCTO + BANNER MULTI-FOTO</div>

<div class="seccion"><h2>1. PORTADA (foto principal)</h2><div class="cont"><input type="file" id="portadaFile" accept="image/*"><img id="preview-portada"><button class="btn-amarillo" id="btnPortada">GUARDAR PORTADA</button><p id="msgPortada" class="ok"></p></div></div>

<div class="seccion"><h2>2. PRODUCTO - con X para borrar foto</h2><div class="cont"><input id="nombre" placeholder="Nombre"><input id="precio" placeholder="Precio"><select id="categoria"><option>HERRAMIENTA</option><option>MUEBLES</option><option>CUCHILLOS</option><option>BOCINAS</option><option>ELECTRONICA</option><option>HOGAR</option><option>OTRO</option></select><textarea id="desc" placeholder="Desc"></textarea><span style="font-size:13px;color:#ccc">FOTOS N (con X):</span><input type="file" id="fotosFiles" accept="image/*" multiple><div id="miniFotos" class="mini-fotos"></div><button class="btn-amarillo" id="btnAgregar">AGREGAR PRODUCTO</button><p id="msgProd" class="ok"></p></div></div>

<div id="listaProductos"></div>

<div class="seccion"><h2>3. BANNERS - Publicidad con muchas fotos</h2><div class="cont"><span style="font-size:13px">Precio editable:</span><div style="display:flex;gap:8px;align-items:center"><input id="bannerPrecio" value="200" style="border:1px solid #FFD600"><button class="btn-amarillo peq" id="btnGuardarPrecio">GUARDAR</button></div><input id="bannerNegocio" placeholder="Negocio"><input id="bannerTel" placeholder="WhatsApp"><span style="font-size:13px;color:#ccc">FOTOS DEL BANNER (muchas, con X):</span><input type="file" id="bannerFiles" accept="image/*" multiple><div id="miniBanners" class="mini-fotos"></div><button class="btn-amarillo" id="btnBanner">AGREGAR BANNER</button><p id="msgBanner" class="ok"></p><div id="listaBanners"></div></div></div>

<script>
function comprimir(file, cb){const r=new FileReader();r.onload=ev=>{const img=new Image();img.onload=()=>{const canvas=document.createElement('canvas');const MAX=800;let w=img.width,h=img.height;if(w>MAX||h>MAX){if(w>h){h=h*MAX/w;w=MAX}else{w=w*MAX/h;h=MAX}}canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);cb(canvas.toDataURL('image/jpeg',0.7));};img.src=ev.target.result;};r.readAsDataURL(file);}
function getProductos(){try{const g=localStorage.getItem('bazar_productos');if(g)return JSON.parse(g);}catch{}return[];}
function saveProductos(a){localStorage.setItem('bazar_productos',JSON.stringify(a));}
let portadaTemp="";document.getElementById('portadaFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;comprimir(f,b64=>{portadaTemp=b64;const img=document.getElementById('preview-portada');img.src=b64;img.style.display='block';document.getElementById('msgPortada').innerText="✅ Foto portada lista";});});
document.getElementById('btnPortada').addEventListener('click',()=>{if(!portadaTemp){alert('Selecciona foto portada');return;}localStorage.setItem('bazar_portada',portadaTemp);document.getElementById('msgPortada').innerText="✅ Portada guardada";});
let fotosTemp=[];function renderMini(){const cont=document.getElementById('miniFotos');cont.innerHTML="";fotosTemp.forEach((src,i)=>{const d=document.createElement('div');d.className='mini-foto';d.innerHTML=`<img src="${src}"><button class="x" onclick="fotosTemp.splice(${i},1);renderMini()">X</button>`;cont.appendChild(d);});}
document.getElementById('fotosFiles').addEventListener('change',e=>{const files=Array.from(e.target.files);let pend=files.length;files.forEach(file=>{comprimir(file,b64=>{fotosTemp.push(b64);pend--;if(pend===0){renderMini();document.getElementById('msgProd').innerText="✅ "+fotosTemp.length+" fotos cargadas";}});});});
document.getElementById('btnAgregar').addEventListener('click',()=>{const n=document.getElementById('nombre').value.trim();const pr=document.getElementById('precio').value.trim();if(!n||!pr){alert('Pon Nombre y Precio');return;}if(fotosTemp.length===0){alert('Pon foto');return;}try{let prods=getProductos();prods.push({id:Date.now(),nombre:n,precio:pr,categoria:document.getElementById('categoria').value,desc:document.getElementById('desc').value,fotos:fotosTemp,img:fotosTemp[0]});saveProductos(prods);document.getElementById('nombre').value="";document.getElementById('precio').value="";document.getElementById('desc').value="";fotosTemp=[];renderMini();document.getElementById('fotosFiles').value="";document.getElementById('msgProd').innerText="✅ Producto agregado";renderProductos();}catch(err){alert("Memoria llena: "+err.message);}});
function renderProductos(){const lista=document.getElementById('listaProductos');lista.innerHTML="";const prods=getProductos();if(prods.length===0){lista.innerHTML="<p style='text-align:center;color:#888;padding:15px'>No hay productos</p>";return;}prods.slice().reverse().forEach(p=>{const row=document.createElement('div');row.className='producto-row';const thumb=(p.fotos&&p.fotos[0])?p.fotos[0]:p.img;row.innerHTML=`<img src="${thumb}"><div class="producto-info"><b>${p.nombre}</b><span>$${p.precio} (${p.fotos?p.fotos.length:1} fotos)</span></div><button class="btn-borrar" onclick="borrarProd(${p.id})">BORRAR</button>`;lista.appendChild(row);});}
function borrarProd(id){if(!confirm('¿Borrar?'))return;saveProductos(getProductos().filter(p=>p.id!==id));renderProductos();}
function getBanners(){try{const g=localStorage.getItem('bazar_banners');if(g)return JSON.parse(g);}catch{}return[];}
function saveBanners(a){localStorage.setItem('bazar_banners',JSON.stringify(a));}
let bannerFotosTemp=[];function renderMiniBanners(){const cont=document.getElementById('miniBanners');cont.innerHTML="";bannerFotosTemp.forEach((src,i)=>{const d=document.createElement('div');d.className='mini-foto';d.innerHTML=`<img src="${src}"><button class="x" onclick="bannerFotosTemp.splice(${i},1);renderMiniBanners()">X</button>`;cont.appendChild(d);});}
document.getElementById('bannerFiles').addEventListener('change',e=>{const files=Array.from(e.target.files);let pend=files.length;files.forEach(file=>{comprimir(file,b64=>{bannerFotosTemp.push(b64);pend--;if(pend===0){renderMiniBanners();document.getElementById('msgBanner').innerText="✅ "+bannerFotosTemp.length+" fotos banner cargadas";}});});});
document.getElementById('btnGuardarPrecio').addEventListener('click',()=>{localStorage.setItem('bazar_banner_precio',document.getElementById('bannerPrecio').value);alert('Precio guardado: $'+document.getElementById('bannerPrecio').value);});
document.getElementById('btnBanner').addEventListener('click',()=>{const neg=document.getElementById('bannerNegocio').value.trim();if(!neg){alert('Pon negocio');return;}if(bannerFotosTemp.length===0){alert('Pon al menos 1 foto banner');return;}const b={id:Date.now(),negocio:neg,tel:document.getElementById('bannerTel').value,precio:localStorage.getItem('bazar_banner_precio')||'200',fotos:bannerFotosTemp,img:bannerFotosTemp[0]};let arr=getBanners();arr.push(b);saveBanners(arr);document.getElementById('bannerNegocio').value="";document.getElementById('bannerTel').value="";document.getElementById('bannerFiles').value="";bannerFotosTemp=[];renderMiniBanners();document.getElementById('msgBanner').innerText="✅ Banner con "+b.fotos.length+" fotos";renderBanners();});
function renderBanners(){const cont=document.getElementById('listaBanners');cont.innerHTML="";getBanners().forEach(b=>{const d=document.createElement('div');d.style="display:flex;justify-content:space-between;align-items:center;background:#000;border:1px solid #333;padding:6px;margin:4px 0;font-size:13px";const thumb=b.fotos?b.fotos[0]:b.img;d.innerHTML=`<div style="display:flex;gap:8px;align-items:center"><img src="${thumb}" style="width:40px;height:40px;object-fit:cover"><span>${b.negocio} - $${b.precio} (${b.fotos?b.fotos.length:1} fotos)</span></div><button style="background:red;color:#fff;border:0;padding:4px 8px;font-weight:900" onclick="saveBanners(getBanners().filter(x=>x.id!==${b.id}));renderBanners()">X</button>`;cont.appendChild(d);});}
document.getElementById('bannerPrecio').value=localStorage.getItem('bazar_banner_precio')||'200';
renderProductos();renderBanners();
</script>
</body>
</html>
