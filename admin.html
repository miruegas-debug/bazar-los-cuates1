<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN - Bazar Los Cuates - ARREGLADO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Black,Impact,sans-serif}
body{background:#0a0a0a;color:#fff;padding:0}
.top-bar{background:#000;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:2px solid #222;position:sticky;top:0;z-index:10}
.top-bar b{color:#FFD600;font-size:18px}
.btn-salir{background:#ff0000;color:#fff;border:0;padding:8px 14px;font-weight:900;cursor:pointer}
.seccion{border:1px solid #333;margin:12px 4px;background:#111}
.seccion h2{color:#FFD600;padding:12px;font-size:16px}
.cont{padding:0 12px 12px}
input, textarea{width:100%;background:#000;color:#fff;border:1px solid #555;padding:12px;margin:6px 0;font-size:15px}
.btn-amarillo{background:#FFD600;color:#000;border:0;padding:14px;font-weight:900;cursor:pointer;width:100%;margin-top:10px;font-size:16px}
.producto-row{display:flex;align-items:center;justify-content:space-between;background:#000;border:1px solid #222;padding:8px;margin:6px 0}
.producto-row img{width:70px;height:70px;object-fit:cover;background:#222}
.producto-info{flex:1;padding:0 10px}
.producto-info b{color:#FFD600;display:block}
.btn-borrar{background:#ff0000;color:#fff;border:0;padding:10px 14px;font-weight:900;cursor:pointer}
#preview{width:100%;max-height:200px;object-fit:cover;display:none;margin:8px 0;border:2px solid #333}
.ok{color:#22c55e;text-align:center;padding:8px;font-weight:900}
</style>
</head>
<body>
<div class="top-bar"><b>ADMIN - ARREGLADO</b><button class="btn-salir" onclick="location.href='./index.html'">SALIR</button></div>
<div style="background:#FFD600;color:#000;text-align:center;padding:6px;font-weight:900;font-size:11px">VERSION ARREGLADA - BOTON FUNCIONA</div>

<div class="seccion">
<h2>Agregar Producto</h2>
<div class="cont">
<input id="nombre" placeholder="Nombre: Ej. Taladro Milwaukee">
<input id="precio" placeholder="Precio: Ej. $850">
<textarea id="desc" placeholder="Descripción corta"></textarea>
<input type="file" id="fileImg" accept="image/*">
<img id="preview">
<button class="btn-amarillo" id="btnAgregar">AGREGAR PRODUCTO</button>
<p id="msg" class="ok"></p>
</div>
</div>

<div class="seccion">
<h2>Productos guardados (<span id="count">0</span>)</h2>
<div id="lista"></div>
<button style="background:#fff;color:#000;border:0;padding:10px;width:100%;font-weight:900;margin-top:10px" onclick="if(confirm('¿Borrar TODO?')){localStorage.removeItem('bazar_productos');render()}">🗑️ BORRAR TODO</button>
</div>

<script>
let imgBase64 = "";
const fileInput = document.getElementById('fileImg');
const preview = document.getElementById('preview');
fileInput.addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    const img = new Image();
    img.onload = ()=>{
      const canvas = document.createElement('canvas');
      const MAX = 800;
      let w = img.width, h = img.height;
      if(w>MAX || h>MAX){ if(w>h){ h = h*MAX/w; w=MAX } else { w = w*MAX/h; h=MAX } }
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      imgBase64 = canvas.toDataURL('image/jpeg',0.7);
      preview.src = imgBase64;
      preview.style.display='block';
      document.getElementById('msg').innerText = "✅ Foto cargada, lista para agregar";
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});
function getProductos(){ try{ const g=localStorage.getItem('bazar_productos'); if(g) return JSON.parse(g); }catch{} return []; }
function saveProductos(a){ localStorage.setItem('bazar_productos', JSON.stringify(a)); }
function render(){
  const productos = getProductos();
  document.getElementById('count').innerText = productos.length;
  const lista = document.getElementById('lista');
  lista.innerHTML="";
  if(productos.length===0){ lista.innerHTML="<p style='text-align:center;color:#888;padding:20px'>No hay productos aún</p>"; return; }
  productos.slice().reverse().forEach(p=>{
    const row=document.createElement('div'); row.className='producto-row';
    row.innerHTML=`<img src="${p.img}"><div class="producto-info"><b>${p.nombre}</b><span>$${p.precio}</span></div><button class="btn-borrar" onclick="borrar(${p.id})">BORRAR</button>`;
    lista.appendChild(row);
  });
}
function borrar(id){ if(!confirm('¿Borrar?')) return; saveProductos(getProductos().filter(p=>p.id!==id)); render(); }
document.getElementById('btnAgregar').addEventListener('click', ()=>{
  const nombre=document.getElementById('nombre').value.trim();
  const precio=document.getElementById('precio').value.trim();
  if(!nombre || !precio){ alert('Pon nombre y precio'); return; }
  if(!imgBase64){ alert('Primero selecciona una foto arriba'); return; }
  try{
    const productos=getProductos();
    productos.push({id:Date.now(), nombre, precio, desc:document.getElementById('desc').value, img:imgBase64, fotos:[imgBase64]});
    saveProductos(productos);
    document.getElementById('nombre').value=""; document.getElementById('precio').value=""; document.getElementById('desc').value=""; document.getElementById('fileImg').value=""; preview.style.display='none'; imgBase64="";
    document.getElementById('msg').innerText="✅ PRODUCTO AGREGADO - YA APARECE EN INDEX";
    render();
  }catch(e){ alert("Memoria llena, borra viejos. Error: "+e.message); }
});
render();
</script>
</body>
</html>
